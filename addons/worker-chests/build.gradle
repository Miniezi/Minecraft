plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group = 'com.mcavillage'
version = '0.1.0'
base { archivesName = 'mca-worker-chests' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client { workingDirectory project.file('run'); mods { mcaworkchests { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { mcaworkchests { source sourceSets.main } } }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar {
    manifest.attributes(['Specification-Title':'MCA Worker Chests','Specification-Vendor':'MCA Village',
        'Specification-Version':'1','Implementation-Title':project.name,'Implementation-Version':project.version])
}
