name: Compile experimental worker-chests addon
on:
  workflow_dispatch:
  push:
    branches: [mrpack-builder]
    paths:
      - 'addons/worker-chests/**'
      - '.github/workflows/build-worker-chests.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile Forge addon
        working-directory: addons/worker-chests
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: mca-worker-chests-experimental
          path: addons/worker-chests/build/libs/*.jar
