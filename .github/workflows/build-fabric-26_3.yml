name: Build Fabric 26.3 mod

on:
  push:
    branches: [fabric-26.3-safe-mod]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Convert mod.txt to Java
        run: python3 scripts/convert_txt.py
      - name: Build mod
        run: gradle --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-safe-tools-fabric-26.3
          path: build/libs/*.jar
          if-no-files-found: error
