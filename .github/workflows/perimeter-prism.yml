name: Perimeter Prism
on:
  push:
    branches: [perimeter-prism-0.3]
    paths: ['perimeter_td/**', '.github/workflows/perimeter-prism.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile Forge siege module
        run: |
          cp 'компилятор модов/settings.gradle' perimeter_td/siege/
          gradle -p perimeter_td/siege build --no-daemon
      - name: Package Prism import
        working-directory: perimeter_td
        run: |
          curl --fail --retry 3 -L https://mediafilez.forgecdn.net/files/7829/406/inf.zip -o inf.zip
          python package_prism.py siege/build/libs/Perimeter-Siege-0.3.0.jar
          unzip -t Perimeter-Prism-0.3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Perimeter-Prism-0.3
          path: perimeter_td/Perimeter-Prism-0.3.zip
